<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XenToba - Admin Testing Interface</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Handle Google OAuth tokens -->
    <script>
    function getParameterByName(name, url = window.location.href) {
        name = name.replace(/[\[\]]/g, '\\$&');
        var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }

    // Check for access_token in URL (from Google OAuth)
    const accessToken = getParameterByName('access_token');
    const refreshToken = getParameterByName('refresh_token');
    
    if (accessToken) {
        localStorage.setItem('xentoba_token', accessToken);
        localStorage.setItem('google_auth_success', 'true');
        if (refreshToken) {
            localStorage.setItem('xentoba_refresh_token', refreshToken);
        }
        // Remove tokens from URL
        const currentUrl = window.location.href;
        const cleanUrl = currentUrl.split('?')[0];
        window.history.replaceState({}, document.title, cleanUrl + '?auth=success');
    }
    </script>
</head>

    </main>

    <footer>

        </div>
    </footer>
    
    <!-- Core JS -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
